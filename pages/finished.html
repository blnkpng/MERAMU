<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MERAMU • Produk Jadi</title>

    <link
        rel="icon"
        href="../assets/branding/favicon-32.png"
    >


    <!-- =====================================================
         FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin

        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

    <!-- =====================================================
         MERAMU CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >
    <link rel="stylesheet" href="../css/density.css">


    <!-- =====================================================
         LUCIDE
    ====================================================== -->

    <script src="https://unpkg.com/lucide@latest"></script>


    <!-- =====================================================
         FINISHED PAGE STYLE
    ====================================================== -->

    <style>

        /* =====================================================
           PAGE
        ===================================================== */

        .finished-page{

            width:100%;

            padding:28px;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .finished-header{

            display:flex;

            align-items:flex-start;

            justify-content:space-between;

            gap:20px;

            margin-bottom:24px;

        }


        .finished-eyebrow{

            display:block;

            margin-bottom:5px;

            font-size:10px;

            font-weight:600;

            letter-spacing:.14em;

            color:#8B9B93;

        }


        .finished-title{

            margin:0;

            font-size:26px;

            line-height:1.2;

            font-weight:700;

            color:#17352A;

        }


        .finished-subtitle{

            margin:7px 0 0;

            font-size:13px;

            color:#7B8A83;

        }


        .finished-actions{

            display:flex;

            align-items:center;

            gap:8px;

        }


        .finished-btn{

            display:inline-flex;

            align-items:center;

            justify-content:center;

            gap:7px;

            min-height:40px;

            padding:0 14px;

            border-radius:12px;

            border:1px solid #DDE9E2;

            background:#FFFFFF;

            color:#315445;

            font-family:"Poppins",sans-serif;

            font-size:12px;

            font-weight:600;

            cursor:pointer;

            transition:

                background .15s ease,

                border-color .15s ease,

                transform .15s ease;

        }


        .finished-btn:hover{

            background:#F5FAF7;

            border-color:#C7DED1;

        }


        .finished-btn:active{

            transform:translateY(1px);

        }


        .finished-btn:disabled{

            opacity:.6;

            cursor:not-allowed;

        }


        .finished-btn.primary{

            border-color:#046738;

            background:#046738;

            color:#FFFFFF;

        }


        .finished-btn.primary:hover{

            background:#035C32;

            border-color:#035C32;

        }


        .finished-btn svg{

            width:16px;

            height:16px;

        }


        /* =====================================================
           FILTER
        ===================================================== */

        .finished-filter{

            display:grid;

            grid-template-columns:

                minmax(0,1fr)

                145px;

            gap:12px;

            margin-bottom:20px;

            padding:18px;

            border:1px solid #E1ECE6;

            border-radius:18px;

            background:#FFFFFF;

            box-shadow:

                0 8px 30px rgba(4,103,56,.05);

        }


        .finished-field{

            min-width:0;

        }


        .finished-field label{

            display:block;

            margin-bottom:6px;

            font-size:10px;

            font-weight:600;

            color:#83928B;

        }


        .finished-select{

            width:100%;

            height:42px;

            padding:0 12px;

            border:1px solid #DCE8E1;

            border-radius:11px;

            background:#FBFDFC;

            color:#29483B;

            font-family:"Poppins",sans-serif;

            font-size:12px;

            outline:none;

        }


        .finished-select:focus{

            border-color:#8BC6A5;

            box-shadow:

                0 0 0 3px rgba(4,103,56,.07);

        }


        /* =====================================================
           BATCH INFO
        ===================================================== */

        .finished-batch{

            margin-bottom:20px;

            padding:20px;

            border:1px solid #DDEAE2;

            border-radius:20px;

            background:

                linear-gradient(

                    145deg,

                    #F3FAF6,

                    #FFFFFF

                );

        }


        .finished-batch-top{

            display:flex;

            align-items:flex-start;

            justify-content:space-between;

            gap:20px;

            margin-bottom:16px;

        }


        .finished-batch-name{

            margin:0;

            font-size:18px;

            font-weight:600;

            color:#17352A;

        }


        .finished-batch-code{

            margin-top:4px;

            font-size:11px;

            color:#819087;

        }


        .finished-status{

            display:inline-flex;

            align-items:center;

            gap:7px;

            padding:6px 10px;

            border-radius:999px;

            background:#EAF7EF;

            color:#046738;

            font-size:10px;

            font-weight:600;

            text-transform:capitalize;

            white-space:nowrap;

        }


        .finished-status-dot{

            width:6px;

            height:6px;

            border-radius:50%;

            background:#046738;

        }


        .finished-batch-grid{

            display:grid;

            grid-template-columns:

                repeat(4,minmax(0,1fr));

            gap:10px;

        }


        .finished-stat{

            padding:12px;

            border:1px solid #E1ECE6;

            border-radius:13px;

            background:rgba(255,255,255,.72);

        }


        .finished-stat span{

            display:block;

            margin-bottom:4px;

            font-size:9px;

            color:#8A9991;

        }


        .finished-stat strong{

            display:block;

            font-size:13px;

            color:#29483B;

        }


        /* =====================================================
           UNIT HEADER
        ===================================================== */

        .finished-section-header{

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:15px;

            margin-bottom:14px;

        }


        .finished-section-title{

            margin:0;

            font-size:16px;

            font-weight:600;

            color:#17352A;

        }


        .finished-count{

            font-size:11px;

            color:#8A9991;

        }


        /* =====================================================
           UNITS
        ===================================================== */

        .finished-units{

            display:grid;

            grid-template-columns:

                repeat(4,minmax(0,1fr));

            gap:12px;

        }


        .finished-unit{

            position:relative;

            min-width:0;

            padding:15px;

            border:1px solid #E1ECE6;

            border-radius:17px;

            background:#FFFFFF;

            transition:

                transform .15s ease,

                box-shadow .15s ease,

                border-color .15s ease;

        }


        .finished-unit:hover{

            transform:translateY(-2px);

            border-color:#C5DED0;

            box-shadow:

                0 10px 28px rgba(4,103,56,.08);

        }


        .finished-unit-top{

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:8px;

            margin-bottom:12px;

        }


        .finished-unit-number{

            font-size:12px;

            font-weight:600;

            color:#315445;

        }


        .finished-unit-status{

            padding:4px 7px;

            border-radius:999px;

            background:#EDF7F1;

            color:#046738;

            font-size:8px;

            font-weight:600;

            text-transform:capitalize;

        }


        /* =====================================================
           QR
        ===================================================== */

        .finished-qr{

            display:flex;

            align-items:center;

            justify-content:center;

            width:100%;

            min-height:150px;

            margin-bottom:12px;

            border-radius:13px;

            background:#FFFFFF;

            border:1px solid #EDF2EF;

        }


        .finished-qr canvas,

        .finished-qr img{

            display:block;

            width:135px !important;

            height:135px !important;

            max-width:135px !important;

            max-height:135px !important;

        }


        /* =====================================================
           TRACE CODE
        ===================================================== */

        .finished-trace-code{

            padding:9px;

            border-radius:10px;

            background:#F7FAF8;

            text-align:center;

            font-size:9px;

            font-weight:600;

            color:#426052;

            word-break:break-all;

        }


        /* =====================================================
           UNIT ACTIONS
        ===================================================== */

        .finished-unit-actions{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:7px;

            margin-top:9px;

        }


        .finished-unit-btn{

            display:flex;

            align-items:center;

            justify-content:center;

            gap:5px;

            height:34px;

            border:1px solid #DDE9E2;

            border-radius:9px;

            background:#FFFFFF;

            color:#426052;

            font-family:"Poppins",sans-serif;

            font-size:9px;

            font-weight:600;

            cursor:pointer;

            transition:

                background .15s ease,

                border-color .15s ease;

        }


        .finished-unit-btn:hover{

            background:#F5FAF7;

            border-color:#C7DED1;

        }


        .finished-unit-btn.primary{

            background:#046738;

            border-color:#046738;

            color:#FFFFFF;

        }


        .finished-unit-btn.primary:hover{

            background:#035C32;

            border-color:#035C32;

        }


        .finished-unit-btn svg{

            width:13px;

            height:13px;

        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .finished-empty{

            grid-column:1 / -1;

            padding:60px 20px;

            text-align:center;

            border:1px dashed #D5E4DB;

            border-radius:18px;

            color:#829189;

        }


        .finished-empty svg{

            width:30px;

            height:30px;

            margin-bottom:10px;

            color:#8EA198;

        }


        .finished-empty strong{

            display:block;

            margin-bottom:4px;

            font-size:13px;

            color:#52675D;

        }


        .finished-empty span{

            font-size:11px;

        }


        /* =====================================================
           TOAST
        ===================================================== */

        #meramuToast{

            font-family:"Poppins",sans-serif !important;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media(max-width:1100px){

            .finished-units{

                grid-template-columns:

                    repeat(3,minmax(0,1fr));

            }

        }


        @media(max-width:900px){

            .finished-batch-grid{

                grid-template-columns:

                    repeat(2,minmax(0,1fr));

            }

            .finished-units{

                grid-template-columns:

                    repeat(2,minmax(0,1fr));

            }

        }


        @media(max-width:760px){

            .finished-page{

                padding:20px 16px;

            }


            .finished-header{

                flex-direction:column;

            }


            .finished-actions{

                width:100%;

            }


            .finished-actions .finished-btn{

                flex:1;

            }


            .finished-filter{

                grid-template-columns:1fr;

            }


            .finished-batch-top{

                flex-direction:column;

            }

        }


        @media(max-width:520px){

            .finished-title{

                font-size:22px;

            }


            .finished-batch-grid{

                grid-template-columns:1fr 1fr;

            }


            .finished-units{

                grid-template-columns:1fr;

            }

        }


        @media(max-width:380px){

            .finished-page{

                padding:18px 12px;

            }


            .finished-batch-grid{

                grid-template-columns:1fr;

            }

        }

        /* =========================================================
   MERAMU FINISHED — MOBILE RESPONSIVE FIX
========================================================= */


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 768px) {

    .finished-page {
        width: 100%;
        max-width: 100%;
        padding: 20px 16px 32px !important;
        box-sizing: border-box;
    }


    /* -----------------------------------------
       HEADER
    ----------------------------------------- */

    .finished-header {
        width: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
    }


    .finished-title {
        font-size: 26px;
        line-height: 1.2;
    }


    .finished-subtitle {
        max-width: 100%;
        font-size: 12px;
        line-height: 1.6;
    }


    .finished-actions {
        flex-shrink: 0;
        gap: 8px;
    }


    .finished-btn {
        min-height: 40px;
        padding: 9px 12px;
        font-size: 11px;
    }


    /* -----------------------------------------
       FINISHED BATCH CARD
    ----------------------------------------- */

    .finished-batch {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: 18px !important;
        border-radius: 18px;
    }


    .finished-batch-top {
        width: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
    }


    .finished-batch-name {
        font-size: 21px;
        line-height: 1.25;
        overflow-wrap: anywhere;
    }


    .finished-batch-code {
        font-size: 11px;
        overflow-wrap: anywhere;
    }


    .finished-status {
        flex-shrink: 0;
        white-space: nowrap;
    }


    /* -----------------------------------------
       BATCH STATS
    ----------------------------------------- */

    .finished-batch-grid {
        width: 100%;
        display: grid !important;
        grid-template-columns:
            repeat(2, minmax(0, 1fr)) !important;
        gap: 10px !important;
        margin-top: 16px;
    }


    .finished-stat {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        padding: 14px !important;
        border-radius: 15px;
    }


    .finished-stat span {
        font-size: 10px;
        line-height: 1.3;
    }


    .finished-stat strong {
        display: block;
        margin-top: 5px;
        font-size: 15px;
        line-height: 1.25;
        overflow-wrap: anywhere;
    }


    /* -----------------------------------------
       INDIVIDUAL BOTTLES
    ----------------------------------------- */

    .finished-units {
        width: 100%;
        min-width: 0;
        display: grid !important;
        grid-template-columns:
            repeat(2, minmax(0, 1fr)) !important;
        gap: 12px !important;
    }


    .finished-unit {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        padding: 12px !important;
        border-radius: 16px;
        overflow: hidden;
    }


    .finished-unit-top {
        gap: 6px;
    }


    .finished-unit-number {
        min-width: 0;
        font-size: 11px;
    }


    .finished-unit-status {
        flex-shrink: 0;
        font-size: 9px;
    }


    .finished-qr {
        width: 100%;
        max-width: 100%;
        margin: 10px auto;
        overflow: hidden;
    }


    .finished-qr canvas,
    .finished-qr img {
        max-width: 100% !important;
        height: auto !important;
    }


    .finished-trace-code {
        width: 100%;
        min-width: 0;
        font-size: 8px;
        overflow-wrap: anywhere;
        word-break: break-word;
    }


    .finished-unit-actions {
        width: 100%;
        display: grid !important;
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
        gap: 6px;
    }


    .finished-unit-btn {
        min-width: 0;
        width: 100%;
        min-height: 36px;
        padding: 7px 6px !important;
        font-size: 9px !important;
    }


    .finished-unit-status-actions {
        width: 100%;
        grid-template-columns:
            repeat(3, minmax(0, 1fr)) !important;
        gap: 5px !important;
    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 480px) {

    .finished-page {
        padding:
            14px
            12px
            28px !important;
    }


    /* -----------------------------------------
       HEADER
    ----------------------------------------- */

    .finished-header {
        flex-direction: column;
        gap: 12px;
        margin-bottom: 14px;
    }


    .finished-eyebrow {
        font-size: 9px;
        letter-spacing: .08em;
    }


    .finished-title {
        font-size: 23px;
        line-height: 1.2;
    }


    .finished-subtitle {
        margin-top: 5px;
        font-size: 11px;
        line-height: 1.5;
    }


    .finished-actions {
        width: 100%;
        display: grid !important;
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
        gap: 8px;
    }


    .finished-btn {
        width: 100%;
        justify-content: center;
        min-height: 40px;
    }


    /* -----------------------------------------
       BATCH CARD
    ----------------------------------------- */

    .finished-batch {
        padding: 14px !important;
        border-radius: 17px;
    }


    .finished-batch-top {
        flex-direction: column;
        gap: 8px;
    }


    .finished-batch-name {
        font-size: 20px;
    }


    .finished-batch-code {
        font-size: 10px;
    }


    .finished-status {
        align-self: flex-start;
    }


    /* -----------------------------------------
       BATCH STATS
    ----------------------------------------- */

    .finished-batch-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr)) !important;
        gap: 8px !important;
    }


    .finished-stat {
        padding: 12px !important;
        border-radius: 14px;
    }


    .finished-stat span {
        font-size: 9px;
    }


    .finished-stat strong {
        font-size: 14px;
    }


    /* -----------------------------------------
       INDIVIDUAL BOTTLES
       
       Pada HP kecil kita kembali 1 kolom.
       QR jadi lebih besar dan nyaman.
    ----------------------------------------- */

    .finished-units {
        grid-template-columns:
            1fr !important;
        gap: 12px !important;
    }


    .finished-unit {
        padding: 14px !important;
        border-radius: 17px;
    }


    .finished-unit-number {
        font-size: 12px;
    }


    .finished-unit-status {
        font-size: 9px;
    }


    .finished-qr {
        margin-top: 10px;
        margin-bottom: 10px;
    }


    .finished-trace-code {
        font-size: 8.5px;
        padding: 7px 8px;
    }


    .finished-unit-btn {
        min-height: 38px;
        font-size: 10px !important;
    }


    .finished-unit-status-actions {
        grid-template-columns:
            repeat(3, minmax(0, 1fr)) !important;
        gap: 5px !important;
    }

}

    </style>

</head>


<body>

    <!-- =====================================================
         SIDEBAR OVERLAY
    ====================================================== -->

    <div
        id="sidebarOverlay"
        class="sidebar-overlay"
    ></div>


    <!-- =====================================================
         APP SHELL
    ====================================================== -->

    <div
        id="appShell"
        class="app-shell"
    >


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <div
            id="sidebar-container"
        ></div>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <main class="content">


            <!-- =============================================
                 TOPBAR
            ============================================== -->

            <div
                id="topbar-container"
            ></div>


            <!-- =============================================
                 FINISHED PAGE
            ============================================== -->

            <div class="finished-page">


                <!-- =========================================
                     HEADER
                ========================================== -->

                <header class="finished-header">

                    <div>

                        <span
                            class="finished-eyebrow"
                        >
                            FINISHED PRODUCTS
                        </span>


                        <h1
                            class="finished-title"
                        >
                            Produk Jadi
                        </h1>


                        <p
                            class="finished-subtitle"
                        >
                            Kelola finished batch,
                            QR code, dan label
                            setiap botol.
                        </p>

                    </div>


                    <div
                        class="finished-actions"
                    >

                        <button
                            id="refreshFinished"
                            class="finished-btn"
                            type="button"
                        >

                            <i
                                data-lucide="refresh-cw"
                            ></i>

                            Refresh

                        </button>


                        <button
                            id="printAllLabels"
                            class="finished-btn primary"
                            type="button"
                        >

                            <i
                                data-lucide="printer"
                            ></i>

                            Print Semua

                        </button>

                    </div>

                </header>


                <!-- =========================================
                     BATCH FILTER
                ========================================== -->

                <section
                    class="finished-filter"
                >

                    <div
                        class="finished-field"
                    >

                        <label
                            for="finishedBatchSelect"
                        >
                            Finished Batch
                        </label>


                        <select
                            id="finishedBatchSelect"
                            class="finished-select"
                        >

                            <option value="">
                                Memuat finished batch...
                            </option>

                        </select>

                    </div>


                    <div
                        class="finished-field"
                    >

                        <label>
                            QR / Label
                        </label>


                        <button
                            id="generateAllQr"
                            class="finished-btn primary"
                            type="button"
                            style="
                                width:100%;
                                height:42px;
                            "
                        >

                            <i
                                data-lucide="qr-code"
                            ></i>

                            Generate QR

                        </button>

                    </div>

                </section>


                <!-- =========================================
                     BATCH INFO
                ========================================== -->

                <section
                    id="finishedBatchInfo"
                    class="finished-batch"
                    style="display:none;"
                >
                </section>


                <!-- =========================================
                     INDIVIDUAL BOTTLES
                ========================================== -->

                <section>

                    <div
                        class="finished-section-header"
                    >

                        <h2
                            class="finished-section-title"
                        >
                            Individual Bottles
                        </h2>


                        <span
                            id="finishedUnitCount"
                            class="finished-count"
                        >
                            —
                        </span>

                    </div>


                    <div
                        id="finishedUnits"
                        class="finished-units"
                    >

                        <div
                            class="finished-empty"
                        >

                            <i
                                data-lucide="package"
                            ></i>


                            <strong>
                                Belum ada finished batch
                            </strong>


                            <span>
                                Pilih finished batch
                                untuk melihat QR
                                setiap botol.
                            </span>

                        </div>

                    </div>

                </section>


            </div>

        </main>

    </div>

         SUPABASE

    ====================================================== -->

    <script

    <!-- =====================================================
         MERAMU COMPONENT LOADER
    ====================================================== -->

    <script
        src="../js/component-loader.js"
    ></script>


    <!-- =====================================================
         MERAMU APP
         Hamburger / Sidebar / Active Menu
    ====================================================== -->

    <script
