<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MERAMU • Product Trace</title>

    <link rel="icon" href="../assets/branding/favicon-32.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        /* =====================================================
           MERAMU PUBLIC TRACE
        ===================================================== */

        *{
            box-sizing:border-box;
        }

        html{
            margin:0;
            padding:0;
            background:#F7FAF8;
        }

        body{
            margin:0;
            padding:0;

            min-height:100vh;

            font-family:"Poppins",sans-serif;

            color:#18352A;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(4,103,56,.07),
                    transparent 32%
                ),
                #F7FAF8;
        }

        /* =====================================================
           APP
        ===================================================== */

        #traceApp{
            width:100%;
        }

        .trace-card{
            width:100%;
            max-width:760px;

            margin:32px auto 60px;

            overflow:hidden;

            background:rgba(255,255,255,.97);

            border:1px solid rgba(4,103,56,.10);

            border-radius:30px;

            box-shadow:
                0 24px 70px rgba(18,67,45,.10);
        }

        /* =====================================================
           BRAND
        ===================================================== */

        .trace-brand{
            display:flex !important;

            align-items:center;
            justify-content:center;

            gap:10px;

            margin:28px auto 0;

            padding:0 20px;

            width:100%;

            text-align:center;
        }

        .trace-brand img{
            display:block !important;

            object-fit:contain !important;

            max-width:none !important;
        }

        .trace-brand .trace-logo-icon{
            width:38px !important;
            height:38px !important;

            min-width:38px !important;
            max-width:38px !important;

            min-height:38px !important;
            max-height:38px !important;

            object-fit:contain !important;
        }

        .trace-brand .trace-logo-text{
            width:126px !important;
            height:auto !important;

            min-width:0 !important;
            max-width:126px !important;

            max-height:42px !important;

            object-fit:contain !important;
        }

        /* =====================================================
           HERO
        ===================================================== */

        .trace-hero{
            position:relative;

            padding:34px 34px 38px;

            text-align:center;

            background:
                linear-gradient(
                    145deg,
                    #F2F9F5 0%,
                    #FFFFFF 72%
                );

            border-bottom:1px solid rgba(4,103,56,.08);
        }

        .trace-hero .trace-brand{
            margin:0 0 28px;

            padding:0;
        }

        .trace-hero-copy{
            max-width:580px;

            margin:0 auto;
        }

        .trace-eyebrow{
            display:block;

            margin-bottom:8px;

            font-size:11px;
            font-weight:600;

            letter-spacing:.16em;

            color:#046738;
        }

        .trace-hero h1{
            margin:0;

            font-size:clamp(25px,4vw,34px);

            line-height:1.2;

            font-weight:700;

            letter-spacing:-.03em;

            color:#163D2C;
        }

        .trace-hero-copy p{
            margin:10px auto 0;

            max-width:520px;

            font-size:13px;

            line-height:1.7;

            color:#718278;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .trace-status{
            display:inline-flex;

            align-items:center;
            justify-content:center;

            gap:8px;

            margin-top:18px;

            padding:7px 13px;

            border-radius:999px;

            font-size:11px;

            font-weight:600;
        }

        .trace-status-dot{
            width:7px;
            height:7px;

            flex:0 0 7px;

            border-radius:50%;

            background:currentColor;
        }

        .trace-status.success{
            color:#046738;
            background:#EAF7EF;
        }

        .trace-status.warning{
            color:#9A6700;
            background:#FFF7DF;
        }

        .trace-status.danger{
            color:#B42318;
            background:#FFF0EE;
        }

        .trace-status.neutral{
            color:#596C63;
            background:#EEF3F0;
        }

        /* =====================================================
           SECTION
        ===================================================== */

        .trace-section{
            padding:30px 34px;

            border-bottom:1px solid rgba(4,103,56,.08);
        }

        .trace-section-header{
            display:flex;

            align-items:flex-start;
            justify-content:space-between;

            gap:20px;

            margin-bottom:22px;
        }

        .trace-section-header > svg{
            width:21px;
            height:21px;

            flex:0 0 auto;

            color:#046738;
        }

        .trace-section-kicker{
            display:block;

            margin-bottom:5px;

            font-size:10px;

            font-weight:600;

            letter-spacing:.14em;

            color:#8B9B93;
        }

        .trace-section h2{
            margin:0;

            font-size:18px;

            line-height:1.3;

            font-weight:600;

            color:#18352A;
        }

        /* =====================================================
           PRODUCT
        ===================================================== */

        .trace-product-grid{
            display:grid;

            grid-template-columns:
                minmax(0,1.5fr)
                repeat(2,minmax(130px,1fr));

            gap:12px;
        }

        .trace-product-main,
        .trace-info-item{
            min-width:0;

            padding:17px;

            border:1px solid #E4EEE8;

            border-radius:16px;

            background:#FBFDFC;
        }

        .trace-product-main{
            display:flex;

            flex-direction:column;

            justify-content:center;
        }

        .trace-product-name{
            font-size:17px;

            font-weight:600;

            color:#18352A;
        }

        .trace-product-code{
            margin-top:4px;

            font-size:11px;

            color:#819087;
        }

        .trace-info-item span{
            display:block;

            margin-bottom:6px;

            font-size:10px;

            font-weight:500;

            color:#8A9991;
        }

        .trace-info-item strong{
            display:block;

            font-size:13px;

            font-weight:600;

            color:#26483A;
        }

        /* =====================================================
           TRACE ID
        ===================================================== */

        .trace-highlight{
            background:
                linear-gradient(
                    145deg,
                    #F4FAF6,
                    #FFFFFF
                );
        }

        .trace-code-box{
            display:flex;

            flex-direction:column;

            gap:6px;

            margin-bottom:14px;

            padding:19px;

            border-radius:18px;

            background:#FFFFFF;

            border:1px solid #DCEBE2;
        }

        .trace-code-box span{
            font-size:10px;

            font-weight:500;

            color:#82928A;
        }

        .trace-code-box strong{
            font-size:18px;

            font-weight:700;

            color:#046738;

            word-break:break-word;
        }

        .trace-mini-grid{
            display:grid;

            grid-template-columns:repeat(4,1fr);

            gap:10px;
        }

        /* =====================================================
           TIMELINE
        ===================================================== */

        .trace-timeline{
            position:relative;

            margin-left:8px;

            padding-left:34px;
        }

        .trace-timeline::before{
            content:"";

            position:absolute;

            top:7px;
            bottom:7px;
            left:10px;

            width:1px;

            background:#DCE9E1;
        }

        .trace-step{
            position:relative;

            display:flex;

            align-items:flex-start;

            min-height:76px;
        }

        .trace-step:last-child{
            min-height:auto;
        }

        .trace-step-icon{
            position:absolute;

            left:-34px;

            display:flex;

            align-items:center;
            justify-content:center;

            width:22px;
            height:22px;

            border-radius:50%;

            background:#FFFFFF;

            border:1px solid #D5E5DC;

            color:#8CA096;
        }

        .trace-step-icon svg{
            width:13px;
            height:13px;
        }

        .trace-step.completed .trace-step-icon,
        .trace-step.current .trace-step-icon{
            color:#046738;

            border-color:#B8DDC7;

            background:#EFF9F3;
        }

        .trace-step-content{
            display:flex;

            flex-wrap:wrap;

            align-items:baseline;

            column-gap:7px;

            row-gap:2px;

            padding-bottom:20px;
        }

        .trace-step-content span{
            width:100%;

            font-size:10px;

            font-weight:500;

            color:#8A9991;
        }

        .trace-step-content strong{
            font-size:13px;

            font-weight:600;

            color:#244A39;
        }

        .trace-step-content small{
            font-size:11px;

            color:#829189;
        }

        /* =====================================================
           COMPONENTS
        ===================================================== */

        .trace-components{
            display:flex;

            flex-direction:column;

            gap:10px;
        }

        .trace-component{
            display:flex;

            align-items:center;

            gap:13px;

            padding:15px;

            border:1px solid #E2ECE6;

            border-radius:16px;

            background:#FBFDFC;
        }

        .trace-component-number{
            display:flex;

            align-items:center;
            justify-content:center;

            width:30px;
            height:30px;

            flex:0 0 30px;

            border-radius:10px;

            background:#EDF7F1;

            color:#046738;

            font-size:11px;

            font-weight:600;
        }

        .trace-component-main{
            flex:1;

            min-width:0;
        }

        .trace-component-title{
            font-size:13px;

            font-weight:600;

            color:#26483A;
        }

        .trace-component-meta{
            margin-top:3px;

            font-size:10px;

            color:#8A9991;
        }

        .trace-component-qty{
            flex:0 0 auto;

            text-align:right;
        }

        .trace-component-qty strong{
            display:block;

            font-size:13px;

            color:#046738;
        }

        .trace-component-qty span{
            font-size:10px;

            color:#84938B;
        }

        .trace-empty{
            padding:20px;

            text-align:center;

            border-radius:16px;

            background:#F8FAF9;

            color:#7C8D84;

            font-size:12px;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .trace-footer{
            display:flex;

            align-items:flex-start;

            gap:13px;

            padding:24px 34px;

            background:#FBFDFC;
        }

        .trace-footer-icon{
            display:flex;

            align-items:center;
            justify-content:center;

            width:34px;
            height:34px;

            flex:0 0 34px;

            border-radius:11px;

            color:#046738;

            background:#EAF7EF;
        }

        .trace-footer-icon svg{
            width:17px;
            height:17px;
        }

        .trace-footer strong{
            display:block;

            margin-bottom:3px;

            font-size:12px;

            color:#315445;
        }

        .trace-footer p{
            margin:0;

            font-size:10px;

            line-height:1.6;

            color:#87968E;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .trace-loading{
            padding:70px 30px;

            text-align:center;
        }

        .trace-loading svg{
            width:28px;
            height:28px;

            color:#046738;

            animation:traceSpin 1s linear infinite;
        }

        .trace-loading p{
            margin:12px 0 0;

            font-size:12px;

            color:#7C8D84;
        }

        @keyframes traceSpin{
            from{
                transform:rotate(0deg);
            }

            to{
                transform:rotate(360deg);
            }
        }

        /* =====================================================
           ERROR
        ===================================================== */

        .trace-error{
            padding:60px 30px;

            text-align:center;
        }

        .trace-error-icon{
            display:flex;

            align-items:center;
            justify-content:center;

            width:52px;
            height:52px;

            margin:0 auto 18px;

            border-radius:16px;

            color:#B42318;

            background:#FFF0EE;
        }

        .trace-error-icon svg{
            width:24px;
            height:24px;
        }

        .trace-error h1{
            margin:0;

            font-size:21px;

            font-weight:600;

            color:#263B31;
        }

        .trace-error p{
            max-width:430px;

            margin:10px auto 0;

            font-size:13px;

            line-height:1.7;

            color:#7A8B82;
        }

        .trace-error-code{
            display:inline-block;

            margin-top:18px;

            padding:8px 12px;

            border-radius:10px;

            background:#F4F7F5;

            font-size:10px;

            color:#75857D;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width:700px){

            .trace-card{
                margin-top:20px;

                margin-bottom:40px;

                border-radius:22px;
            }

            .trace-brand{
                margin-top:20px;
            }

            .trace-brand .trace-logo-icon{
                width:34px !important;
                height:34px !important;

                min-width:34px !important;
                max-width:34px !important;

                min-height:34px !important;
                max-height:34px !important;
            }

            .trace-brand .trace-logo-text{
                width:112px !important;

                max-width:112px !important;
            }

            .trace-hero{
                padding:28px 20px 30px;
            }

            .trace-section{
                padding:24px 20px;
            }

            .trace-footer{
                padding:20px;
            }

            .trace-product-grid{
                grid-template-columns:1fr;
            }

            .trace-mini-grid{
                grid-template-columns:repeat(2,1fr);
            }

            .trace-code-box strong{
                font-size:15px;
            }
        }

        @media(max-width:420px){

            .trace-mini-grid{
                grid-template-columns:1fr;
            }

            .trace-component{
                align-items:flex-start;
            }

            .trace-hero h1{
                font-size:24px;
            }

            .trace-section h2{
                font-size:17px;
            }
        }

    </style>
</head>

<body>

         PUBLIC TRACE APP
    ===================================================== -->

        <div class="trace-loading">

            <i data-lucide="loader-circle"></i>

            <p>

            </p>

        </div>

    </div>

</body>
</html>
