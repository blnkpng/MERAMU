<section class="kpi-grid">

  <!-- Batch Aktif -->
  <article class="kpi-card">
    <div class="kpi-top">
      <div class="kpi-icon green">
        <i data-lucide="flask-conical"></i>
      </div>
      <span class="kpi-change up">+2 hari ini</span>
    </div>

    <span class="kpi-label">Batch Aktif</span>
    <h3 class="kpi-value">12</h3>
    <p class="kpi-caption">Sedang diproses</p>
  </article>

  <!-- F1 -->
  <article class="kpi-card">
    <div class="kpi-top">
      <div class="kpi-icon blue">
        <i data-lucide="beaker"></i>
      </div>
      <span class="kpi-change">Hari ke-3</span>
    </div>

    <span class="kpi-label">Fermentasi F1</span>
    <h3 class="kpi-value">8</h3>
    <p class="kpi-caption">Batch aktif</p>
  </article>

  <!-- F2 -->
  <article class="kpi-card">
    <div class="kpi-top">
      <div class="kpi-icon purple">
        <i data-lucide="wine"></i>
      </div>
      <span class="kpi-change">Normal</span>
    </div>

    <span class="kpi-label">Fermentasi F2</span>
    <h3 class="kpi-value">5</h3>
    <p class="kpi-caption">Menunggu panen</p>
  </article>

  <!-- Siap Panen -->
  <article class="kpi-card">
    <div class="kpi-top">
      <div class="kpi-icon orange">
        <i data-lucide="leaf"></i>
      </div>
      <span class="kpi-change up">Besok</span>
    </div>

    <span class="kpi-label">Siap Panen</span>
    <h3 class="kpi-value">3</h3>
    <p class="kpi-caption">Batch siap dipanen</p>
  </article>

  <!-- Produk -->
  <article class="kpi-card">
    <div class="kpi-top">
      <div class="kpi-icon teal">
        <i data-lucide="package"></i>
      </div>
      <span class="kpi-change">Inventory</span>
    </div>

    <span class="kpi-label">Total Produk</span>
    <h3 class="kpi-value">24</h3>
    <p class="kpi-caption">SKU aktif</p>
  </article>

  <!-- Stok Kritis -->
  <article class="kpi-card danger">
    <div class="kpi-top">
      <div class="kpi-icon red">
        <i data-lucide="triangle-alert"></i>
      </div>
      <span class="kpi-change danger-text">Perlu restock</span>
    </div>

    <span class="kpi-label">Stok Kritis</span>
    <h3 class="kpi-value">2</h3>
    <p class="kpi-caption">Bahan hampir habis</p>
  </article>

</section>
