<!-- =========================================================
     MERAMU LIVE PRODUCTION BOARD
========================================================= -->

<section class="live-production">

    <!-- Header -->
    <div class="live-production-header">

        <div>
            <div class="section-eyebrow">
                <span class="live-dot"></span>
                LIVE
            </div>

            <h3>Live Production</h3>

            <p>
                Pantau seluruh batch yang sedang berjalan.
            </p>
        </div>

        <button class="live-refresh-btn" id="refreshLiveProduction">
            <i data-lucide="refresh-cw"></i>
            <span>Refresh</span>
        </button>

    </div>


    <!-- Summary -->
    <div class="live-production-summary">

        <div class="live-summary-item">
            <strong id="liveTotal">0</strong>
            <span>Total Aktif</span>
        </div>

        <div class="live-summary-item">
            <strong id="liveProduksi">0</strong>
            <span>Produksi</span>
        </div>

        <div class="live-summary-item">
            <strong id="liveF1">0</strong>
            <span>F1</span>
        </div>

        <div class="live-summary-item">
            <strong id="liveF2">0</strong>
            <span>F2</span>
        </div>

    </div>


    <!-- Production Cards -->
    <div id="liveProductionList" class="live-production-list">
        <!-- Diisi oleh live-production.js -->
    </div>

</section>
