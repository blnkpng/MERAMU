<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MERAMU • Botanical Beverage System</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/branding/favicon-32.png">

  <!-- Tailwind (sementara untuk utility class) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Icon -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <!-- Overlay (muncul saat sidebar mobile dibuka) -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- =============================
       APP SHELL
       Desktop : Sidebar | Content
       Mobile  : Drawer Sidebar
  ============================== -->
  <div id="appShell" class="app-shell">

    <!-- Sidebar akan di-load dari components/sidebar.html -->
    <aside id="sidebar-container"></aside>

    <!-- Konten -->
    <main class="content">

      <!-- Topbar Desktop & Mobile -->
      <div id="topbar-container"></div>

      <!-- Hero Dashboard -->
      <div id="hero-container"></div>

      <!-- KPI Cards -->
      <div id="kpi-container"></div>

      <!-- Live Production -->
      <div id="live-production-container"></div>

      <!-- Quick Actions -->
      <div id="quick-container"></div>

      <!-- Inventory Snapshot -->
      <div id="inventory-snapshot-container"></div>

      <!-- Production Timeline -->
      <div id="timeline-container"></div>

      <!-- Batch Sheet -->
      <div id="batch-sheet-container"></div>

      <!-- Content selanjutnya -->
      <section id="dashboard-content"></section>

    </main>

  </div>

  <!-- ==========================================
       SUPABASE CONFIG
       config.js dibuat otomatis oleh Netlify
  =========================================== -->
  <script src="js/config.js"></script>

  <!-- ==========================================
       SUPABASE CLIENT
  =========================================== -->
  <script src="js/supabase.js"></script>

  <!-- ==========================================
       COMPONENT / FEATURE SCRIPTS
  =========================================== -->
  <script src="js/live-production.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/component-loader.js"></script>

  <!-- ==========================================
       MAIN APP
  =========================================== -->
  <script src="js/app.js"></script>

  <!-- ==========================================
       LUCIDE ICON REFRESH
  =========================================== -->
  <script>
    window.addEventListener("load", () => {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>

</body>
</html>
